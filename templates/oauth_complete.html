<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete Smart Serve Sign In</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>body{min-height:100vh;display:grid;place-items:center;padding:24px}.oauth-card{max-width:520px;width:100%;padding:32px;border-radius:28px;background:rgba(255,255,255,.08);border:1px solid rgba(120,150,220,.25);box-shadow:0 20px 60px rgba(0,0,0,.2)}.oauth-card h1{margin:0 0 8px}.oauth-card p{color:#8fa4c7}.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.role-option{padding:18px;border-radius:18px;border:1px solid rgba(120,150,220,.25);background:rgba(255,255,255,.05)}.role-option input{margin-right:8px}.oauth-card input[type=text],.oauth-card input[type=number]{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(120,150,220,.25);background:rgba(255,255,255,.06);color:inherit;margin-top:7px;margin-bottom:14px}.continue{width:100%;border:0;border-radius:14px;padding:14px;background:#1769ff;color:#fff;font-weight:800}</style>
</head><body><section class="oauth-card"><div>🔐 Secure Google session</div><h1>Finish your Smart Serve account</h1><p>Signed in as <strong>{{ pending.name }}</strong> ({{ pending.email }}). Choose how you will use Smart Serve.</p><form method="POST"><div class="role-grid"><label class="role-option"><input type="radio" name="role" value="customer" checked onchange="toggleProvider(false)">Customer<br><small>Book local services</small></label><label class="role-option"><input type="radio" name="role" value="provider" onchange="toggleProvider(true)">Provider<br><small>Offer your skills</small></label></div><div id="providerFields" style="display:none"><label>Skills</label><input type="text" name="skills" placeholder="Plumbing, Electrical"><label>Experience (years)</label><input type="number" name="experience" min="0" max="60" value="0"></div><button class="continue" type="submit">Continue to Smart Serve →</button></form></section><script>function toggleProvider(v){document.getElementById('providerFields').style.display=v?'block':'none'}</script></body></html>
