<!DOCTYPE html>
<html>

<head>

    <title>AI Analysis - Smart Serve</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        SMART SERVE
    </div>

    <div>

        <a href="{{ url_for('customer_dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </div>

</nav>


<div class="dashboard">

    <div class="form-card">

        <h1>🤖 AI Problem Analysis</h1>

        <h3>
            {{ service["name"] }}
        </h3>


        <div class="problem-box">

            <strong>Your Problem:</strong>

            <p>
                {{ description }}
            </p>

        </div>


        <div class="ai-result">

            <h2>Gemini AI Result</h2>

            <div class="ai-text">

                {{ ai_result | replace('\n', '<br>') | safe }}

            </div>

        </div>


        <div class="result-actions">

            <a class="button"
               href="{{ url_for('customer_dashboard') }}">

                Go to Dashboard

            </a>

            <a class="button secondary"
               href="{{ url_for('request_service') }}">

                New Request

            </a>

        </div>

    </div>

</div>

</body>
</html>
